apiVersion: v2
name: pulumi-exporter
icon: https://www.pulumi.com/logos/brand/avatar-on-white.svg
description: A Helm chart for the Pulumi Cloud OpenTelemetry metrics exporter
keywords:
  - pulumi
  - opentelemetry
  - otel
  - metrics
  - exporter
  - prometheus
type: application
version: 0.1.12
appVersion: 0.1.9
home: https://github.com/pulumi-labs/pulumi-exporter/
sources:
  - https://github.com/pulumi-labs/pulumi-exporter/
maintainers:
  - email: engin@pulumi.com
    name: pulumi-labs

annotations:
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/changes: |
    - kind: changed
      description: "Breaking via appVersion 0.1.9: OTLP header values are percent-decoded, so write a literal % as %25; a malformed header entry stops startup"
    - kind: fixed
      description: Graceful shutdown waits for the in-flight collection before flushing metrics, via appVersion 0.1.9
  artifacthub.io/images: |
    - name: pulumi-exporter
      image: ghcr.io/pulumi-labs/pulumi-exporter:0.1.9
  artifacthub.io/license: MIT
  artifacthub.io/maintainers: |
    - name: pulumi-labs
      email: engin@pulumi.com
