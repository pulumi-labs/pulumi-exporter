apiVersion: v2
name: pulumi-exporter
icon: https://www.pulumi.com/logos/brand/avatar-on-white.svg
description: A Helm chart for the Pulumi Cloud OpenTelemetry metrics exporter
keywords:
  - pulumi
  - opentelemetry
  - otel
  - metrics
  - exporter
  - prometheus
type: application
version: 0.1.11
appVersion: 0.1.8
home: https://github.com/pulumi-labs/pulumi-exporter/
sources:
  - https://github.com/pulumi-labs/pulumi-exporter/
maintainers:
  - email: engin@pulumi.com
    name: pulumi-labs

annotations:
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/changes: |
    - kind: fixed
      description: Quote container args so values containing " #" or ": " (for example in otlp.headers) reach the exporter intact
    - kind: changed
      description: "Document the OTLP header format on otlp.headers. Breaking for exporter versions after 0.1.8: header values are percent-decoded, so a literal % must be written as %25"
  artifacthub.io/images: |
    - name: pulumi-exporter
      image: ghcr.io/pulumi-labs/pulumi-exporter:0.1.8
  artifacthub.io/license: MIT
  artifacthub.io/maintainers: |
    - name: pulumi-labs
      email: engin@pulumi.com
